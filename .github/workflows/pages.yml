name: pages

# Publishes web/ to GitHub Pages whenever main changes the page or its data.
# One-time setup in the repository: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". Until that is set, the deploy job fails with "Get Pages site failed".

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The page is static, so "build" is proving the engine still agrees with Python before it ships.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Engine and parity tests
        run: |
          npm ci
          npm test

      # A new cache name per release, so returning visitors' service workers drop the old copy.
      - name: Stamp the offline cache with this commit
        run: sed -i "s/const VERSION = 'funis-v1'/const VERSION = 'funis-${GITHUB_SHA::8}'/" web/sw.js

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
