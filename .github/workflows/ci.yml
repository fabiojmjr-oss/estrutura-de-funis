name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Read-only by default: no job here writes to the repository, and a public repository's CI should
# not hold a token that could.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, types and the fast suite, on every supported interpreter. The fast suite runs in
  # seconds, so this is the job that gates a push.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -m "not slow" --cov --cov-report=term-missing

  # Every figure quoted in a README, plus all the example scripts. These take minutes rather
  # than seconds - the gate policies are re-simulated over many draws - and they
  # do not depend on the interpreter version, so they run once rather than across the matrix.
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify every documented figure
        run: pytest -m slow -v

  # The web interface: lint, the engine's unit and parity tests against the Python-exported
  # vectors, then the page itself in Chromium on desktop and phone viewports. No interpreter
  # matrix: the page ships as static files and the tests pin one Node and one browser.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Lint
        run: npx eslint web eslint.config.js

      - name: Engine and parity tests
        run: npm test

      - name: Browser tests
        run: npm run e2e
